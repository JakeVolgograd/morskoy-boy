<!doctype html>
<html lang="ru" class="modal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdfcf6">
<meta name="game-version" content="9">
<title>Морской бой</title>
<link rel="icon" id="favicon" href="icon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cell:32px;
  --paper:#fdfcf6;
  --grid:#bcd4ea;
  --margin:#e98a92;
  --ink:#1f3d8f;
  --ink-soft:rgba(31,61,143,.55);
  --red:#cf2f2a;
  --pencil:#55565c;
  --marker:rgba(255,231,92,.65);
  --desk:#c9bea6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--desk) radial-gradient(circle at 30% 20%,#d8cfb9 0,#c3b79c 70%);
  font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}

/* ---------- лист тетради ---------- */
.paper{
  background-color:var(--paper);
  background-image:
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px),
    linear-gradient(to right,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);
}
.sheet{
  position:relative;
  min-height:100vh;
  margin:0 auto;
  padding:calc(var(--cell)*.5 + var(--sat,0px)) calc(var(--cell)*2.2) calc(var(--cell)*2) calc(var(--cell)*1.2);
  box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 50px rgba(60,40,10,.35);
  overflow:hidden;
}
.sheet::after,.splash::after{ /* поля */
  content:'';position:absolute;top:0;bottom:0;right:calc(var(--cell)*1.2);
  width:2px;background:var(--margin);opacity:.75;pointer-events:none;
}
.sheet::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 80% 0%,rgba(0,0,0,.035),transparent 50%),
             radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.04),transparent 55%);
}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.title{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:calc(var(--cell)*1.55);font-weight:700;line-height:1.1;position:relative;transform:rotate(-1.5deg)}
h1 svg{position:absolute;left:-4px;bottom:-6px;width:calc(100% + 8px);height:14px;overflow:visible}
.mode-tag{font-size:calc(var(--cell)*.7);color:var(--pencil);transform:rotate(-1deg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.status{
  position:relative;z-index:1;
  height:calc(var(--cell)*2);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:calc(var(--cell)*.95);line-height:1;font-weight:600;
}
.status span{display:inline-block;transform:rotate(-.6deg)}
.status .red{color:var(--red)}
.status .pen{color:var(--ink)}
.status .grey{color:var(--pencil)}
.fresh>span{animation:writein .5s ease-out}
@keyframes writein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

.boards{display:flex;justify-content:center;align-items:flex-start;gap:calc(var(--cell)*1.5);flex-wrap:wrap;position:relative;z-index:1}
.side{display:flex;flex-direction:column;align-items:flex-start;min-width:calc(var(--cell)*var(--bn,12))}
.cap{height:calc(var(--cell)*1.4);font-size:calc(var(--cell)*.95);font-weight:700;padding-left:calc(var(--cell)*1);display:flex;align-items:center;gap:8px;transition:color .3s}
.board{position:relative;width:calc(var(--cell)*var(--bn,12));height:calc(var(--cell)*var(--bn,12) + 2px);transition:opacity .35s, filter .35s}
.board svg{position:absolute;left:0;top:0;overflow:visible;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board.dim{opacity:.55;filter:grayscale(.35)}
.board.target svg{cursor:crosshair}
.board.placing svg{cursor:pointer}
.fleet{display:block;margin-left:var(--cell);overflow:visible}
.shake{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-4px,2px) rotate(-.4deg)}
  40%{transform:translate(4px,-2px) rotate(.4deg)}
  60%{transform:translate(-3px,1px)}
  80%{transform:translate(2px,-1px)}
}

/* ---------- штрихи ---------- */
.pen{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pen.thin{stroke-width:1.1;opacity:.6}
.pen.mid{stroke-width:1.5}
.pen.bold{stroke-width:2.6}
.redpen{fill:none;stroke:var(--red);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.redpen.thin{stroke-width:1.6}
.pencil{fill:none;stroke:var(--pencil);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.pencil.light{opacity:.45}
.hullfill{fill:rgba(31,61,143,.1);stroke:none}
.hullfill.pencil{fill:rgba(85,86,92,.08)}
.inkfill{fill:var(--ink);opacity:.75;stroke:none}
.inkfill.pencil{fill:var(--pencil);opacity:.6}
.ghost{fill:rgba(31,61,143,.08);stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4;stroke-linecap:round}
.ghost.bad{fill:rgba(207,47,42,.08);stroke:var(--red)}
.dot{fill:#2d2f3a;stroke:none}
.dot.auto{fill:#6b6d78;opacity:.75}
.label{font-family:'Caveat',cursive;fill:var(--ink);font-weight:600}

.draw{stroke-dasharray:1.02;stroke-dashoffset:1.02;animation:draw var(--dur,.3s) ease-out var(--delay,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .3s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.ring{fill:none;stroke:var(--pencil);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ring .7s ease-out forwards;opacity:0}
@keyframes ring{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.burst{stroke-dasharray:1.02;stroke-dashoffset:1.02;animation:draw .16s ease-out var(--delay,0s) forwards,fade .45s ease-in calc(var(--delay,0s) + .35s) forwards}
@keyframes fade{to{opacity:0}}
.smoke{fill:none;stroke:var(--pencil);stroke-width:1.2;opacity:.7;transform-box:fill-box;transform-origin:center;animation:smoke .9s ease-out forwards}
@keyframes smoke{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.5) translateY(-6px);opacity:0}}
.debris{fill:var(--red);animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--tx),var(--ty));opacity:0}}
.boom{fill:#ffd23e;opacity:0;transform-box:fill-box;transform-origin:center;animation:boom .35s ease-out forwards}
@keyframes boom{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}

/* слово над клеткой */
.word{
  position:absolute;z-index:50;pointer-events:none;white-space:nowrap;
  font-size:calc(var(--cell)*1.15);font-weight:700;
  transform:translate(-50%,-100%) rotate(-7deg);
  animation:word 1.5s ease-out forwards;
  text-shadow:0 0 6px var(--paper),0 0 2px var(--paper);
}
.word.miss{color:var(--pencil);font-size:calc(var(--cell)*.95)}
.word.hit{color:var(--red)}
.word.sunk{color:var(--red);font-size:calc(var(--cell)*1.45)}
@keyframes word{
  0%{clip-path:inset(0 100% 0 0);opacity:1}
  28%{clip-path:inset(0 0 0 0)}
  70%{opacity:1;transform:translate(-50%,-100%) rotate(-7deg)}
  100%{clip-path:inset(0 0 0 0);opacity:0;transform:translate(-50%,-170%) rotate(-7deg)}
}

/* ---------- кнопки "от руки" ---------- */
.btn{
  background:transparent;border:2px solid var(--ink);cursor:pointer;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  padding:2px 14px 4px;font-size:calc(var(--cell)*.72);font-weight:600;line-height:1.2;
  transition:transform .15s, background .15s;
}
.btn:hover{background:var(--marker);transform:rotate(-1.5deg) scale(1.03)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;background:transparent;transform:none}
.btn.big{font-size:calc(var(--cell)*1);padding:4px 26px 6px;border-width:2.5px}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.small{font-size:calc(var(--cell)*.6);padding:0 10px 2px}
.btn.off{opacity:.55;text-decoration:line-through;text-decoration-color:var(--red)}

/* ---------- панель расстановки ---------- */
.dock{width:calc(var(--cell)*max(12, var(--bn,12)));min-height:calc(var(--cell)*var(--bn,12));padding-left:var(--cell);display:flex;flex-direction:column;gap:calc(var(--cell)*.35)}
.dock .hint{font-size:calc(var(--cell)*.62);color:var(--pencil);line-height:1.15}
.pool{display:flex;flex-wrap:wrap;gap:calc(var(--cell)*.3) calc(var(--cell)*.45);align-items:center;align-content:flex-start;min-height:calc(var(--cell)*4.6)}
.pool svg{cursor:pointer;overflow:visible;border-radius:10px;transition:transform .15s, background .15s}
.pool svg:hover{transform:rotate(-3deg) translateY(-2px)}
.pool svg.sel{background:var(--marker)}
.pool svg{touch-action:none}
.pool.turned svg{animation:turnin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes turnin{from{transform:rotate(-90deg) scale(.6);opacity:.3}}
.board.placing svg{touch-action:none}
.btn.orient{display:inline-flex;align-items:center;gap:6px;background:var(--marker)}
.btn.orient svg{overflow:visible}
#dragShip{position:fixed;left:0;top:0;z-index:80;pointer-events:none;filter:drop-shadow(2px 4px 3px rgba(0,0,0,.25));transition:opacity .1s}
#dragShip svg{display:block;overflow:visible}
.dock .row{display:flex;gap:8px;flex-wrap:wrap}
.dock .note{font-size:calc(var(--cell)*.75);color:var(--pencil)}
.dock .loader{margin-top:calc(var(--cell)*.5)}

/* ---------- кораблик-загрузчик ---------- */
.loader{display:block;overflow:hidden}
.loader .rock{transform-origin:80px 66px;animation:rock 2.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-3px)}}
.loader .waves{animation:waves 1.6s linear infinite}
.loader .waves.w2{animation-duration:2.4s;animation-direction:reverse}
@keyframes waves{to{transform:translateX(-40px)}}
.loader .puff{fill:none;stroke:var(--pencil);stroke-width:1.3;opacity:0;animation:puff 2.2s ease-out infinite}
.loader .puff.p2{animation-delay:.7s}
.loader .puff.p3{animation-delay:1.4s}
@keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-14px,-22px) scale(1.4)}}
.puff{transform-box:fill-box;transform-origin:center}
.card .loader{margin:4px auto}

/* ---------- заставка ---------- */
.splash{
  position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  transform-origin:left center;box-shadow:0 0 60px rgba(0,0,0,.3);
}
.splash.out{animation:pageturn .9s cubic-bezier(.5,0,.75,0) forwards;pointer-events:none}
@keyframes pageturn{
  0%{transform:perspective(1800px) rotateY(0)}
  100%{transform:perspective(1800px) rotateY(-100deg);opacity:.2}
}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:16px}
.splash-title{font-size:clamp(52px,9vw,96px);font-weight:700;line-height:1;transform:rotate(-2deg);animation:writein 1.1s ease-out both;position:relative}
.splash-title svg{position:absolute;left:0;bottom:-10px;width:100%;height:18px;overflow:visible}
.splash-sub{font-size:24px;color:var(--pencil);margin-top:-6px;animation:writein .8s ease-out .9s both}
.splash-text{font-size:26px;color:var(--pencil);height:32px}
.splash-text.fresh>span{animation:writein .45s ease-out}
.splash-bar{overflow:visible}
#splashGo{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;transform-origin:center}

/* ---------- карточка (модалка) ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(60,45,20,.28);padding:16px}
.overlay.show{display:flex}
.card{
  position:relative;width:min(470px,100%);max-height:calc(100vh - 32px);overflow:auto;
  background-color:var(--paper);
  background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px),linear-gradient(to right,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  padding:30px 28px 26px;
  box-shadow:0 14px 40px rgba(0,0,0,.35);
  transform:rotate(-1.2deg);
  animation:cardin .35s cubic-bezier(.3,1.4,.5,1);
  text-align:center;
  font-size:22px;
}
.card::before,.card::after{
  content:'';position:absolute;top:-12px;width:90px;height:26px;background:rgba(240,228,170,.75);
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.card::before{left:22px;transform:rotate(-8deg)}
.card::after{right:22px;transform:rotate(7deg)}
@keyframes cardin{from{transform:rotate(-8deg) scale(.7);opacity:0}}
.card h2{margin:0 0 8px;font-size:40px;line-height:1.05}
.card h2.win{color:var(--red);font-size:56px}
.card p{margin:6px 0;line-height:1.15}
.card .muted{color:var(--pencil);font-size:20px}
.card .stack{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.card .stack .btn{min-width:250px;font-size:25px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.card .row .btn{font-size:23px}
.code{font-size:60px;font-weight:700;letter-spacing:8px;color:var(--red);margin:6px 0;user-select:all}
.codeinput{
  width:240px;font-size:46px;font-weight:700;letter-spacing:8px;text-align:center;color:var(--red);
  background:transparent;border:none;border-bottom:2.5px solid var(--ink);outline:none;padding:0 0 2px;
}
.rules{text-align:left;font-size:19px;color:var(--pencil);margin-top:16px;line-height:1.15;border-top:1.5px dashed var(--ink-soft);padding-top:10px}
.rules b{color:var(--ink)}
.card .upd{margin-top:12px}
.card .upd:empty{display:none}
.card .ver{margin-top:8px;font-size:calc(15px*var(--ui,1));color:var(--pencil);opacity:.7}
.err{color:var(--red)}
.grey{color:var(--pencil)}

/* Раскладка «поля друг под другом» (телефон, планшет в портрете).
   Класс body.stacked ставит JS, выбирая вариант с самыми крупными клетками. */
body.stacked .sheet{padding:calc(var(--cell)*.3 + var(--sat,0px)) calc(var(--cell)*.9) calc(var(--cell)*1) calc(var(--cell)*.25)}
/* --sat — высота прозрачной строки состояния телефона (передаёт Android-приложение) */
.splash-inner{padding-top:calc(16px + var(--sat,0px))}
.overlay{padding-top:calc(16px + var(--sat,0px))}
body.stacked .sheet::after,body.stacked .splash::after{right:calc(var(--cell)*.45)}
body.stacked .boards{flex-direction:column;align-items:center;gap:calc(var(--cell)*.3)}
body.stacked.playing .side.en{order:-1}
/* в бою уменьшено поле того, кто сейчас НЕ ходит (класс .minified ставит JS) */
body.stacked.playing .side.minified .board{width:calc(var(--cell)*var(--bn,12)*var(--mini,.62));height:calc((var(--cell)*var(--bn,12) + 2px)*var(--mini,.62))}
body.stacked.playing .side.minified .fleet{display:none}
body.stacked.playing .side{min-width:0}
body.notrans .board,body.notrans .board svg{transition:none!important}
/* школьные каракули карандашом на свободных местах листа (во время боя) */
.doodles{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.doodle{fill:none;stroke:#66676e;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.62}
.doodle.fillp{fill:#66676e;stroke:none}
.doodle.red{stroke:var(--red);opacity:.72}
.doodle-text{font-family:'Caveat',cursive;fill:#66676e;opacity:.7;font-weight:600}
.doodle-text.red{fill:var(--red);opacity:.8}
.doodle-text.fadein{animation:fadein .8s ease-out both}
@keyframes fadein{from{opacity:0}}
body.compact .doodles{grid-column:1 / -1}
.board.flip{will-change:transform}

/* Компактная альбомная раскладка (телефон лёжа): шапка и статус — колонкой слева, поля — на всю высоту */
body.compact .sheet{display:grid;grid-template-columns:var(--sbw,160px) 1fr;grid-template-rows:auto 1fr;column-gap:calc(var(--cell)*.5);align-items:start;
  padding:calc(var(--cell)*.3 + var(--sat,0px)) calc(var(--cell)*1.2) calc(var(--cell)*.3) calc(var(--cell)*.4)}
body.compact header.top{grid-column:1;grid-row:1;flex-direction:column;align-items:flex-start;gap:6px}
body.compact .title{flex-direction:column;align-items:flex-start;gap:2px}
body.compact h1{font-size:calc(var(--cell)*1.05)}
body.compact .mode-tag{font-size:calc(var(--cell)*.55)}
body.compact .tools{flex-direction:column;align-items:stretch;gap:5px}
body.compact .tools .btn{font-size:calc(var(--cell)*.55)}
body.compact .status{grid-column:1;grid-row:2;height:auto;justify-content:flex-start;text-align:left;font-size:calc(var(--cell)*.68);line-height:1.15;padding-top:10px}
body.compact .sheet{grid-template-rows:auto auto 1fr}
body.compact .boards{grid-column:2;grid-row:1 / span 3;flex-wrap:nowrap;gap:calc(var(--cell)*.5);justify-content:center}
.side-fleets{display:none}
body.compact .side-fleets{display:block;grid-column:1;grid-row:3;align-self:start;padding-top:6px}
body.compact .side-fleets .fleet{width:100%;height:auto;margin:2px 0 8px}
.side-fleets .lbl{font-size:calc(var(--cell)*.55);color:var(--pencil)}
body.compact .cap{height:calc(var(--cell)*1);font-size:calc(var(--cell)*.75)}
body.stacked .status{font-size:calc(var(--cell)*.8)}
body.stacked.playing .sheet{padding-bottom:calc(var(--cell)*.3)}
/* во время боя страница не прокручивается и не «пружинит» */
html.locked,html.locked body{overflow:hidden;overscroll-behavior:none;height:100%}
html.locked .sheet{min-height:100%}
html{overscroll-behavior-y:none}
/* пока открыто меню/карточка или заставка — фон не прокручивается */
html.modal,html.modal body{overflow:hidden;overscroll-behavior:none}
.overlay{overscroll-behavior:contain}
.card{overscroll-behavior:contain}

/* ---------- панель громкости ---------- */
.vol-panel{
  position:fixed;z-index:120;width:min(calc(420px*var(--ui,1)),calc(100vw - 16px));
  background-color:var(--paper);
  background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px),linear-gradient(to right,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  border:2px solid var(--ink);border-radius:14px 4px 12px 5px/5px 12px 4px 14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px 14px 12px;
  transform:rotate(-.8deg);animation:cardin .25s cubic-bezier(.3,1.4,.5,1);
  font-size:calc(20px*var(--ui,1));
}
.vol-title{font-weight:700;font-size:1.1em;margin-bottom:4px}
.vol-row{display:grid;grid-template-columns:5.6em 1fr 2.2em;align-items:center;gap:10px;margin:10px 0 4px;text-align:left}
.vol-row b{text-align:right;color:var(--red);font-weight:700}
.vol-row input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;cursor:pointer;touch-action:none;
}
.vol-row input[type=range]::-webkit-slider-runnable-track{
  height:12px;border-radius:7px 5px 8px 4px;border:2px solid var(--ink);
  background:linear-gradient(to right,var(--red) var(--p,50%),transparent var(--p,50%));
}
.vol-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:32px;height:32px;margin-top:-12px;border-radius:50% 45% 52% 48%;
  background:var(--paper);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink-soft);
}
.vol-row input[type=range]::-moz-range-track{height:12px;border-radius:6px;border:2px solid var(--ink);background:transparent}
.vol-row input[type=range]::-moz-range-progress{height:12px;background:var(--red);border-radius:6px}
.vol-row input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.card .menu-vol{margin-top:12px;border-top:1.5px dashed var(--ink-soft);padding-top:6px}
.card .modes{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.card .modes span{color:var(--pencil)}
.card .modes .btn{font-size:calc(21px*var(--ui,1))}
.btn.sel{background:var(--marker);border-width:2.5px}
body.stacked h1{font-size:calc(var(--cell)*1.3)}

<body>
<div class="splash paper" id="splash">

<script>
(() => {
'use strict';

/* =========================================================
   Константы и утилиты
   ========================================================= */
// размер поля и флот зависят от режима (10×10, 8×8, 6×6)
const MODES = {
  10: [4, 3, 3, 2, 2, 2, 1, 1, 1, 1],
  8: [3, 2, 2, 1, 1, 1],
  6: [3, 2, 1, 1],
};
let N = 10;
let LETTERS = 'АБВГДЕЖЗИК'.split('');
let FLEET = MODES[10];
let BN = 12;                       // ширина поля с подписями и запасом, в клетках
function setSize(n) {
  n = MODES[n] ? +n : 10;
  N = n; FLEET = MODES[n]; BN = n + 2;
  LETTERS = 'АБВГДЕЖЗИК'.slice(0, n).split('');
  document.documentElement.style.setProperty('--bn', BN);
}
try { setSize(+localStorage.getItem('morboy-size') || 10); } catch (e) { setSize(10); }
const SVGNS = 'http://www.w3.org/2000/svg';
let C = 32;

const $ = s => document.querySelector(s);
const inb = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const grid = v => Array.from({ length: N }, () => Array(N).fill(v));
const mod = (a, m) => ((a % m) + m) % m;
const rnd = n => Math.floor(Math.random() * n);
const f = n => n.toFixed(1);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shipCells = (r, c, L, h) => Array.from({ length: L }, (_, i) => h ? [r, c + i] : [r + i, c]);

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const seedOf = (...k) => hashStr(k.join('|') + '|' + G.seed);
const RR = (...k) => rng(seedOf(...k));

/* =========================================================
   «Рисование от руки»
   ========================================================= */
function line(x1, y1, x2, y2, R, amp = 1.2, over = .05) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const j = () => (R() - .5) * 2 * amp;
  const o1 = len * over * R(), o2 = len * over * R();
  const sx = x1 - ux * o1 + nx * j() * .6, sy = y1 - uy * o1 + ny * j() * .6;
  const ex = x2 + ux * o2 + nx * j() * .6, ey = y2 + uy * o2 + ny * j() * .6;
  const bow = j() * Math.min(1.4, len / 40);
  const c1x = x1 + dx * .3 + nx * (bow + j() * .4), c1y = y1 + dy * .3 + ny * (bow + j() * .4);
  const c2x = x1 + dx * .7 + nx * (bow + j() * .4), c2y = y1 + dy * .7 + ny * (bow + j() * .4);
  return `M${f(sx)} ${f(sy)}C${f(c1x)} ${f(c1y)} ${f(c2x)} ${f(c2y)} ${f(ex)} ${f(ey)}`;
}
function rect(x, y, w, h, R, amp = 1.2) {
  return line(x, y, x + w, y, R, amp) + line(x + w, y, x + w, y + h, R, amp) +
         line(x + w, y + h, x, y + h, R, amp) + line(x, y + h, x, y, R, amp);
}
function smooth(p) {
  let d = `M${f(p[0][0])} ${f(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d;
}
function blob(cx, cy, r, R, turns = 1, irr = .15) {
  const n = Math.max(8, Math.round(11 * turns)), pts = [], a0 = R() * Math.PI * 2;
  for (let i = 0; i <= n; i++) {
    const a = a0 + i / n * Math.PI * 2 * turns, k = 1 + (R() - .5) * irr * 2;
    pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]);
  }
  return smooth(pts);
}
function mk(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function stroke(parent, d, cls, anim) {
  const e = mk('path', { d, class: cls }, parent);
  if (anim) {
    e.setAttribute('pathLength', '1');
    e.classList.add('draw');
    e.style.setProperty('--delay', (anim.delay || 0) + 's');
    e.style.setProperty('--dur', (anim.dur || .3) + 's');
  }
  return e;
}

/* ---------- корабль (вид сверху, нос вправо) ---------- */
function hullD(W, H, R, ins = 0) {
  const j = () => (R() - .5) * 1.1;
  const t = H * .06 + ins, b = H * .94 - ins, mid = H / 2;
  const bl = Math.min(W * .34, H * .85), xb = W - bl;
  const s0 = Math.min(H * .2, W * .15) + ins * .8;
  const pts = [[s0, t], [xb * .5, t], [xb, t], [xb + bl * .62 - ins * .7, mid - (mid - t) * .5],
    [W - ins * 1.7, mid], [xb + bl * .62 - ins * .7, mid + (b - mid) * .5], [xb, b], [xb * .5, b],
    [s0, b], [ins * .9 + H * .03, mid], [s0, t]];
  return smooth(pts.map(([x, y]) => [x + j(), y + j()]));
}
function shipDetails(g, W, H, L, cls, fillCls, R) {
  const mid = H / 2, bl = Math.min(W * .34, H * .85), xb = W - bl, s = H * .28;
  const len = Math.max(H * .3, xb + bl * .25 - s);
  const at = p => s + len * p;
  const turret = (x, dir) => {
    stroke(g, blob(x, mid, H * .14, R, 1.08, .1), cls);
    stroke(g, line(x + dir * H * .12, mid, x + dir * H * .42, mid, R, .3, 0), cls);
  };
  const cabin = (x, w) => stroke(g, rect(x - w / 2, mid - H * .16, w, H * .32, R, .5), cls);
  const funnel = x => mk('path', { d: blob(x, mid, H * .09, R, 1, .15) + 'Z', class: fillCls }, g);
  if (L === 1) { cabin(at(.4), H * .34); funnel(at(.88)); }
  else if (L === 2) { cabin(at(.22), H * .46); funnel(at(.44)); turret(at(.84), 1); }
  else if (L === 3) { turret(at(.08), -1); cabin(at(.42), H * .6); funnel(at(.61)); turret(at(.88), 1); }
  else { turret(at(.05), -1); turret(at(.22), -1); cabin(at(.44), H * .62); funnel(at(.59)); funnel(at(.67)); turret(at(.9), 1); }
}
function drawShipShape(g, x, y, w, h, horiz, L, style, seed) {
  const W = horiz ? w : h, H = horiz ? h : w;
  const sg = mk('g', { transform: horiz ? `translate(${f(x)} ${f(y)})` : `translate(${f(x + w)} ${f(y)}) rotate(90)` }, g);
  const d1 = hullD(W, H, rng(seed));
  if (style.startsWith('ghost')) { mk('path', { d: d1 + 'Z', class: style }, sg); return sg; }
  const pc = style === 'pencil';
  mk('path', { d: d1 + 'Z', class: 'hullfill' + (pc ? ' pencil' : '') }, sg);
  stroke(sg, d1, pc ? 'pencil' : 'pen');
  stroke(sg, hullD(W, H, rng(seed + 1)), pc ? 'pencil light' : 'pen thin');
  stroke(sg, hullD(W, H, rng(seed + 2), H * .11), pc ? 'pencil light' : 'pen thin');
  shipDetails(sg, W, H, L, pc ? 'pencil' : 'pen mid', pc ? 'inkfill pencil' : 'inkfill', rng(seed + 3));
  return sg;
}

/* ---------- кораблик на волнах (загрузчик) ---------- */
function loaderSVG(opt = {}) {
  const ui = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui')) || 1;
  const w = Math.round((opt.w || 160) * ui), h = Math.round(w * 92 / 160);
  let k = 0;
  const dr = (dur = .5) => opt.draw ? ` pathLength="1" style="--delay:${(k++ * .18).toFixed(2)}s;--dur:${dur}s"` : '';
  const dc = opt.draw ? ' draw' : '';
  let w1 = 'M-40 77', w2 = 'M-40 85';
  for (let i = 0; i < 14; i++) { w1 += ' q10 -6 20 0'; w2 += ' q10 5 20 0'; }
  return `<svg class="loader" viewBox="0 0 160 92" width="${w}" height="${h}">
    <g class="rock">
      <path class="hullfill" d="M24 54 C 60 56, 100 53, 136 54 L 122 73 C 95 75, 65 74, 40 73 Z"/>
      <path class="pen${dc}"${dr(.6)} d="M24 54 C 60 56, 100 53, 136 54 L 122 73 C 95 75, 65 74, 40 73 Z"/>
      <path class="pen thin${dc}"${dr(.5)} d="M27 58 C 60 60, 100 57, 131 58"/>
      <path class="pen mid${dc}"${dr()} d="M52 54 L53 41 C 66 40, 80 41, 92 40 L93 54"/>
      <path class="pen mid${dc}"${dr()} d="M62 40 L63 31 L72 31 L72 40"/>
      <path class="pen mid${dc}"${dr()} d="M60 47 h6 M71 47 h6 M82 47 h6"/>
      <path class="pen mid${dc}"${dr()} d="M108 54 L108 20"/>
      <path class="redpen thin${dc}"${dr()} d="M108 21 C 115 22, 120 25, 126 27 C 120 29, 114 31, 108 33"/>
      <circle class="pen thin" cx="48" cy="64" r="2.4"/><circle class="pen thin" cx="64" cy="64.5" r="2.4"/>
      <circle class="pen thin" cx="80" cy="64.5" r="2.4"/><circle class="pen thin" cx="96" cy="64.5" r="2.4"/>
      <circle class="pen thin" cx="112" cy="64" r="2.4"/>
      <circle class="puff" cx="67" cy="26" r="3.5"/><circle class="puff p2" cx="67" cy="26" r="3.5"/><circle class="puff p3" cx="67" cy="26" r="3.5"/>
    </g>
    <g class="waves"><path class="pen" d="${w1}"/></g>
    <g class="waves w2"><path class="pen thin" d="${w2}"/></g>
  </svg>`;
}

/* =========================================================
   Модель поля
   ========================================================= */
class Board {
  constructor() { this.reset(); }
  reset() { this.marks = grid(0); this.ships = []; this.occ = grid(-1); this.sunk = []; }
  // marks: 0 — пусто, 1 — промах, 2 — попадание, 3 — точка вокруг потопленного
  rebuild() { this.occ = grid(-1); this.ships.forEach((s, i) => s.cells.forEach(([r, c]) => this.occ[r][c] = i)); }
  canPlace(cells) {
    for (const [r, c] of cells) {
      if (!inb(r, c)) return false;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (inb(rr, cc) && this.occ[rr][cc] >= 0) return false;
      }
    }
    return true;
  }
  add(cells) { this.ships.push({ cells, hits: 0, sunk: false }); this.rebuild(); }
  removeAt(r, c) { const i = this.occ[r][c]; if (i < 0) return null; const s = this.ships.splice(i, 1)[0]; this.rebuild(); return s; }
  randomize() {
    for (let attempt = 0; attempt < 200; attempt++) {
      this.ships = []; this.rebuild();
      let ok = true;
      for (const L of FLEET) {
        let placed = false;
        for (let t = 0; t < 400 && !placed; t++) {
          const h = Math.random() < .5;
          const cells = shipCells(rnd(h ? N : N - L + 1), rnd(h ? N - L + 1 : N), L, h);
          if (this.canPlace(cells)) { this.add(cells); placed = true; }
        }
        if (!placed) { ok = false; break; }
      }
      if (ok) return;
    }
  }
  receiveShot(r, c) {
    if (this.marks[r][c] !== 0) return { res: this.marks[r][c] === 2 ? 'hit' : 'miss', repeat: true };
    const i = this.occ[r][c];
    if (i < 0) { this.applyResult(r, c, 'miss'); return { res: 'miss' }; }
    const s = this.ships[i];
    s.hits++;
    if (s.hits >= s.cells.length) {
      s.sunk = true;
      const around = this.applyResult(r, c, 'sunk', s.cells);
      return { res: 'sunk', cells: s.cells, around, over: this.allSunk() };
    }
    this.applyResult(r, c, 'hit');
    return { res: 'hit' };
  }
  applyResult(r, c, res, cells) {
    this.marks[r][c] = res === 'miss' ? 1 : 2;
    const around = [];
    if (res === 'sunk' && cells) {
      const own = new Set(cells.map(([a, b]) => a * N + b));
      this.sunk.push(cells.map(x => [x[0], x[1]]));
      for (const [sr, sc] of cells) {
        this.marks[sr][sc] = 2;
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const rr = sr + dr, cc = sc + dc;
          if (inb(rr, cc) && !own.has(rr * N + cc) && this.marks[rr][cc] === 0) { this.marks[rr][cc] = 3; around.push([rr, cc]); }
        }
      }
    }
    return around;
  }
  allSunk() { return this.sunk.length >= FLEET.length; }
}

/* =========================================================
   Состояние игры
   ========================================================= */
const G = {
  seed: 1, mode: null, phase: 'menu',   // menu | placing | playing | over
  me: new Board(), enemy: new Board(),
  myTurn: false, busy: false,
  meReady: false, oppReady: false,
  wantAgain: false, oppWantAgain: false,
  aiTimer: null, hoverEn: null,
};
const P = { pool: [], sel: null, horiz: true, hover: null, touch: false };

/* =========================================================
   Отрисовка полей
   ========================================================= */
class View {
  constructor(svg, id) { this.svg = svg; this.id = id; }
  setup() {
    const s = this.svg, W = (N + 1) * C;
    s.innerHTML = '';
    s.setAttribute('width', W); s.setAttribute('height', W);
    s.setAttribute('viewBox', `0 0 ${W} ${W}`);
    const root = mk('g', { transform: 'translate(.5 .5)' }, s);
    this.gFrame = mk('g', {}, root);
    this.gShips = mk('g', {}, root);
    this.gMarks = mk('g', {}, root);
    this.gHover = mk('g', {}, root);
    this.gFx = mk('g', {}, root);
    const fs = C * .74;
    LETTERS.forEach((L, c) => {
      const R = RR(this.id, 'L', c);
      mk('text', { x: (c + 1.5) * C, y: C * .78, 'text-anchor': 'middle', class: 'label', 'font-size': fs,
        transform: `rotate(${f((R() - .5) * 8)} ${(c + 1.5) * C} ${C * .6})` }, this.gFrame).textContent = L;
    });
    for (let r = 0; r < N; r++) {
      const R = RR(this.id, 'N', r);
      mk('text', { x: C * .86, y: (r + 1.5) * C + fs * .3, 'text-anchor': 'end', class: 'label', 'font-size': fs,
        transform: `rotate(${f((R() - .5) * 8)} ${C * .6} ${(r + 1.5) * C})` }, this.gFrame).textContent = r + 1;
    }
    const R = RR(this.id, 'frame');
    stroke(this.gFrame, rect(C, C, N * C, N * C, R, 1.6), 'pen bold');
    stroke(this.gFrame, rect(C, C, N * C, N * C, R, 1.6), 'pen thin');
  }
}
const vMe = new View($('#svgMe'), 'me');
const vEn = new View($('#svgEn'), 'en');

function bbox(cells) {
  let r0 = 99, c0 = 99, r1 = -1, c1 = -1;
  for (const [r, c] of cells) { r0 = Math.min(r0, r); c0 = Math.min(c0, c); r1 = Math.max(r1, r); c1 = Math.max(c1, c); }
  return { r0, c0, r1, c1 };
}
function drawShip(g, cells, style, key) {
  const { r0, c0, r1, c1 } = bbox(cells);
  const horiz = r0 === r1;
  const al = C * .04, ac = C * .08;
  const ix = horiz ? al : ac, iy = horiz ? ac : al;
  drawShipShape(g, (c0 + 1) * C + ix, (r0 + 1) * C + iy, (c1 - c0 + 1) * C - 2 * ix, (r1 - r0 + 1) * C - 2 * iy,
    horiz, cells.length, style, seedOf(key));
}
function drawMark(v, r, c, type, anim, delay = 0) {
  const x = (c + 1) * C, y = (r + 1) * C, cx = x + C / 2, cy = y + C / 2;
  const R = RR(v.id, 'm', r, c);
  if (type === 1 || type === 3) {
    const e = mk('path', { d: blob(cx, cy, C * (type === 1 ? .12 : .085), R, 1, .22) + 'Z', class: type === 1 ? 'dot' : 'dot auto' }, v.gMarks);
    if (anim) { e.classList.add('pop'); e.style.animationDelay = delay + 's'; }
  } else if (type === 2) {
    const k = C * .2;
    stroke(v.gMarks, line(x + k, y + k, x + C - k, y + C - k, R, 1.6, .1), 'redpen', anim && { delay, dur: .16 });
    stroke(v.gMarks, line(x + C - k, y + k, x + k, y + C - k, R, 1.6, .1), 'redpen', anim && { delay: delay + .17, dur: .16 });
  }
}
function drawSunk(v, cells, anim, delay = 0) {
  const { r0, c0, r1, c1 } = bbox(cells);
  const i = C * .04;
  const x = (c0 + 1) * C + i, y = (r0 + 1) * C + i, w = (c1 - c0 + 1) * C - 2 * i, h = (r1 - r0 + 1) * C - 2 * i;
  const R = RR(v.id, 'sunk', r0, c0);
  stroke(v.gMarks, rect(x, y, w, h, R, 1.8), 'redpen thin', anim && { delay, dur: .5 });
  stroke(v.gMarks, rect(x, y, w, h, R, 1.8), 'redpen thin', anim && { delay: delay + .35, dur: .5 });
}
function renderBoard(v, b, own, reveal) {
  v.gShips.innerHTML = ''; v.gMarks.innerHTML = ''; v.gFx.innerHTML = '';
  b.ships.forEach((s, i) => {
    if (own) drawShip(v.gShips, s.cells, 'pen', v.id + 'ship' + s.cells[0] + s.cells.length);
    else if (reveal && !s.sunk) drawShip(v.gShips, s.cells, 'pencil', v.id + 'rev' + i);
  });
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (b.marks[r][c]) drawMark(v, r, c, b.marks[r][c], false);
  b.sunk.forEach(cells => drawSunk(v, cells, false));
}

/* ---------- эффекты ---------- */
function fxMiss(v, r, c) {
  const cx = (c + 1.5) * C, cy = (r + 1.5) * C;
  const made = [];

/* ---------- учёт флота под полем ---------- */
function renderFleet(svg, b, key) {
  const d = C * .56, gap = C * .32;
  // флот делим на два ряда: крупные корабли сверху, мелкие снизу
  const total = FLEET.reduce((s, L) => s + L, 0);
  const rows = [[], []];
  let acc = 0;
  FLEET.forEach(L => { (acc < total * .45 ? rows[0] : rows[1]).push(L); acc += L; });
  const rowW = row => row.reduce((s, L) => s + L * d, 0) + Math.max(0, row.length - 1) * gap + 8;
  const left = {};
  b.sunk.forEach(s => left[s.length] = (left[s.length] || 0) + 1);
  svg.innerHTML = '';
  const W = MODE === 'compact' ? Math.max(rowW(rows[0]), rowW(rows[1])) : (N + 1) * C, H = d * 2 + gap + 8;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  rows.forEach((row, ri) => {
    let x = 2;
    row.forEach((L, i) => {
      const y = 4 + ri * (d + gap);
      const dead = left[L] > 0;
      if (dead) left[L]--;
      const g = mk('g', { opacity: dead ? .45 : 1 }, svg);
      drawShipShape(g, x, y, L * d, d, true, L, 'pen', seedOf(key, ri, i));
      if (dead) stroke(svg, line(x - 3, y + d * .75, x + L * d + 3, y + d * .25, RR(key, 'x', ri, i), 1, 0), 'redpen thin');

}

}

/* ---------- наведение ---------- */

$('#dock').addEventListener('click', e => {

function rotate() {

/* ---------- перетаскивание кораблей (мышь и палец) ---------- */
const D = { pending: false, active: false };

}

  D.el.style.transform = `translate(${f(x - D.el.offsetWidth / 2)}px,${f(y - D.el.offsetHeight / 2)}px) rotate(-3deg)`;
  const p = boardPoint(vMe, x, y);

// поворот поставленного корабля: пробуем вокруг каждой его клетки, начиная с первой
function rotatePlaced(cells) {
  const L = cells.length, h = isHoriz(cells);
  if (L === 1) { shake(vMe); return; }
  G.me.removeAt(cells[0][0], cells[0][1]);
  let best = null, tried = null;
  for (let k = 0; k < L && !best; k++) {
    const [pr, pc] = cells[k];
    const nc = h ? shipCells(pr - k, pc, L, false) : shipCells(pr, pc - k, L, true);
    if (!nc.every(([r, c]) => inb(r, c))) continue;
    if (!tried) tried = nc;
    if (G.me.canPlace(nc)) best = nc;
  }
  P.lastDrop = performance.now();
  if (best) { G.me.add(best); sfx('scratch'); refreshMe(); return; }
  G.me.add(cells); refreshMe();
  P.flash = tried || cells; renderHover();
  sfx('bad'); shake(vMe);
  setTimeout(() => { P.flash = null; renderHover(); }, 650);
}

/* ---------- ввод на полях ---------- */

  if (i < 0) return;
  e.preventDefault();
  const cells = G.me.ships[i].cells.map(x => [x[0], x[1]]);

});

function startPlaying() {
  G.phase = 'playing'; G.busy = true;
  G.doodleSeed = (Math.random() * 1e9) | 0; G.doodlesShown = false;   // новые каракули на каждый бой
  if (C !== BASE_C) setCell(BASE_C);      // начинаем подгонку с исходного размера клетки
  renderAll();
  fit();
  updateMusic();
  const who = G.myTurn ? 'Ты ходишь первым!' : (G.mode === 'ai' ? 'Первым ходит компьютер' : 'Первым ходит друг');
  setStatus('Бой! ' + who, 'red');
  setTimeout(() => {
    if (G.phase !== 'playing') return;
    G.busy = false; updateTurnUI();
    if (G.mode === 'ai' && !G.myTurn) aiTurn();
  }, 1300);
}
function shootAt(r, c) {
  if (G.phase !== 'playing' || !G.myTurn || G.busy) return;
  if (G.enemy.marks[r][c] !== 0) return;
  sfx('scratch');
  G.hoverEn = null; renderHover();
  if (G.mode === 'ai') {
    afterMyShot(r, c, G.enemy.receiveShot(r, c));
  } else {
    G.busy = true;
    G.pendingShot = [r, c];
    send({ t: 'shot', r, c });
    setStatus('Пли!..', 'grey');
  }
}
function afterMyShot(r, c, res) {
  G.busy = true;
  animateResult(vEn, G.enemy, r, c, res);
  if (res.over) {
    if (G.mode !== 'ai') send({ t: 'reveal', ships: G.me.ships.map(s => s.cells) });
    gameOver(true);
    return;
  }
  if (res.res === 'miss') G.myTurn = false;
  const wait = res.res === 'miss' ? 650 : res.res === 'hit' ? 600 : 1200;
  setTimeout(() => {
    if (G.phase !== 'playing') return;
    G.busy = false; updateTurnUI();
    if (G.mode === 'ai' && !G.myTurn) aiTurn();
  }, wait);
}
function onIncomingShot(r, c) {
  const res = G.me.receiveShot(r, c);
  if (G.mode !== 'ai') send({ t: 'res', r, c, res: res.res, cells: res.cells || null, over: !!res.over });
  if (res.repeat) return res;
  animateResult(vMe, G.me, r, c, res);
  if (res.over) { gameOver(false); return res; }
  if (res.res === 'miss') {
    G.myTurn = true; G.busy = true;
    setTimeout(() => { if (G.phase === 'playing') { G.busy = false; updateTurnUI(); } }, 650);
  } else {
    setStatus(res.res === 'sunk' ? 'Твой корабль потоплен!' : 'По тебе попали!', 'red');
  }
  return res;
}
function gameOver(win) {
  G.phase = 'over'; G.myTurn = false; G.busy = true;
  clearTimeout(G.aiTimer);
  updateMusic();
  updateTurnUI();
  setStatus(win ? 'Победа! Флот противника на дне!' : 'Все твои корабли потоплены…', win ? 'red' : 'grey');
  setTimeout(() => {
    if (G.phase !== 'over') return;
    renderBoard(vEn, G.enemy, false, true);
    sfx(win ? 'win' : 'lose');
    showOver(win);
  }, 1500);
}

/* ---------- компьютер ---------- */
function aiPick(b) {
  const m = b.marks;
  const sunkSet = new Set(b.sunk.flat().map(([r, c]) => r * N + c));
  const hits = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (m[r][c] === 2 && !sunkSet.has(r * N + c)) hits.push([r, c]);
  const diagHit = (r, c) => [[-1, -1], [-1, 1], [1, -1], [1, 1]].some(([dr, dc]) => inb(r + dr, c + dc) && m[r + dr][c + dc] === 2);
  const free = (r, c) => inb(r, c) && m[r][c] === 0 && !diagHit(r, c);
  let cand = [];
  if (hits.length) {
    if (hits.length >= 2) {
      const horiz = hits[0][0] === hits[1][0];
      hits.sort((a, b) => horiz ? a[1] - b[1] : a[0] - b[0]);
      const a = hits[0], z = hits[hits.length - 1];
      cand = horiz ? [[a[0], a[1] - 1], [z[0], z[1] + 1]] : [[a[0] - 1, a[1]], [z[0] + 1, z[1]]];
    } else {
      const [r, c] = hits[0];
      cand = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
    }
    cand = cand.filter(([r, c]) => free(r, c));
    if (cand.length) return cand[rnd(cand.length)];
  }
  const left = [...FLEET];
  b.sunk.forEach(s => { const i = left.indexOf(s.length); if (i >= 0) left.splice(i, 1); });
  const score = grid(0);
  for (const L of left) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const h of [true, false]) {
    if (L === 1 && !h) continue;
    const cells = shipCells(r, c, L, h);
    if (cells.every(([rr, cc]) => free(rr, cc))) cells.forEach(([rr, cc]) => score[rr][cc]++);
  }
  let best = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) best = Math.max(best, score[r][c]);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (best && score[r][c] >= best * .85) cand.push([r, c]);
  if (!cand.length) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (m[r][c] === 0) cand.push([r, c]);
  return cand[rnd(cand.length)];
}
function aiTurn() {
  if (G.phase !== 'playing' || G.myTurn) return;
  clearTimeout(G.aiTimer);
  G.aiTimer = setTimeout(() => {
    if (G.phase !== 'playing' || G.myTurn) return;
    const [r, c] = aiPick(G.me);
    const res = onIncomingShot(r, c);
    if (res && !res.over && res.res !== 'miss') aiTurn();
  }, 850 + Math.random() * 600);
}

/* =========================================================
   Сеть: обмен через публичные MQTT-серверы (WebSocket)
   Без WebRTC и без PeerJS — работает там, где peerjs.com недоступен.
   Подключаемся сразу ко всем серверам, шлём в каждый, дубли отсеиваем;
   каждое сообщение подтверждается и при потере отправляется повторно.
   ========================================================= */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
];
const TOPIC = 'tetrad-morboy-v2/';
const TE = new TextEncoder(), TD = new TextDecoder();
const randId = n => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < n; i++) s += a[rnd(a.length)]; return s; };
const mqStr = s => { const b = TE.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
function mqPk(type, body) {
  const head = [type];
  let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; head.push(d); } while (n > 0);
  return new Uint8Array([...head, ...body]);
}

class MqttWS {
  constructor(url, h) {
    this.url = url; this.h = h; this.subs = []; this.ok = false; this.closed = false; this.tries = 0;
    this.open();
  }
  open() {
    if (this.closed) return;
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.retry(); return; }
    ws.binaryType = 'arraybuffer';
    this.ws = ws; this.buf = new Uint8Array(0);
    const guard = setTimeout(() => { if (!this.ok) try { ws.close(); } catch (e) {} }, 9000);
    ws.onopen = () => ws.send(mqPk(0x10, [...mqStr('MQTT'), 4, 0x02, 0, 120, ...mqStr('mb' + randId(12))]));
    ws.onmessage = e => this.feed(new Uint8Array(e.data));
    ws.onclose = ws.onerror = () => {
      clearTimeout(guard);
      if (this.ws !== ws) return;
      this.ws = null; clearInterval(this.ping);
      const was = this.ok; this.ok = false;
      if (was) this.h.state();
      this.retry();
    };
  }
  retry() {
    if (this.closed) return;
    this.tries++;
    setTimeout(() => this.open(), Math.min(10000, 1000 * this.tries));
  }
  feed(chunk) {
    const b = new Uint8Array(this.buf.length + chunk.length);
    b.set(this.buf); b.set(chunk, this.buf.length);
    let p = 0;
    while (b.length - p >= 2) {
      let len = 0, mul = 1, i = p + 1, done = false;
      while (i < b.length && i < p + 5) { const d = b[i++]; len += (d & 127) * mul; mul *= 128; if (!(d & 128)) { done = true; break; } }
      if (!done || b.length - i < len) break;
      this.packet(b[p], b.subarray(i, i + len));
      p = i + len;
    }
    this.buf = b.slice(p);
  }
  packet(h0, body) {
    const type = h0 >> 4;
    if (type === 2) {                       // CONNACK
      if (body[1] !== 0) { try { this.ws.close(); } catch (e) {} return; }
      this.ok = true; this.tries = 0;
      this.subs.forEach((t, k) => this.ws.send(mqPk(0x82, [0, k + 1, ...mqStr(t), 0])));
      this.ping = setInterval(() => { try { this.ws && this.ws.send(new Uint8Array([0xC0, 0])); } catch (e) {} }, 25000);
      this.h.state();
    } else if (type === 3) {                // PUBLISH
      const tl = (body[0] << 8) | body[1];
      let i = 2 + tl;
      if ((h0 >> 1) & 3) i += 2;
      this.h.msg(TD.decode(body.subarray(2, 2 + tl)), TD.decode(body.subarray(i)));
    }
  }
  publish(topic, text) {
    if (!this.ok || !this.ws) return;
    try { this.ws.send(mqPk(0x30, [...mqStr(topic), ...TE.encode(text)])); } catch (e) {}
  }
  close() {
    this.closed = true; clearInterval(this.ping);
    const ws = this.ws; this.ws = null; this.ok = false;
    if (ws) { try { ws.send(new Uint8Array([0xE0, 0])); ws.close(); } catch (e) {} }
  }
}

class Relay {
  constructor(code, role, ev) {
    this.role = role; this.ev = ev;
    this.me = randId(10); this.peer = null; this.connected = false; this.closed = false;
    const base = TOPIC + code;
    this.inbox = base + '/' + role;
    this.outbox = base + '/' + (role === 'host' ? 'guest' : 'host');
    this.seq = 0; this.pending = new Map(); this.next = 1; this.held = new Map();
    this.lastHeard = 0; this.k = 0;
    this.clients = BROKERS.map(u => {
      const c = new MqttWS(u, { state: () => this.ev.up && this.ev.up(this.up()), msg: (t, p) => this.onRaw(p) });
      c.subs.push(this.inbox);
      return c;
    });
    this.timer = setInterval(() => this.tick(), 1500);
  }
  up() { return this.clients.filter(c => c.ok).length; }
  raw(obj) {
    const o = Object.assign({}, obj, { from: this.me });
    if (this.peer && !o.to) o.to = this.peer;
    const s = JSON.stringify(o);
    this.clients.forEach(c => c.publish(this.outbox, s));
  }
  send(m) {
    const o = Object.assign({}, m, { seq: ++this.seq });
    this.pending.set(o.seq, o);
    this.raw(o);
  }
  tick() {
    if (this.closed) return;
    if (this.role === 'guest' && !this.peer && this.up()) this.raw({ t: 'join' });
    this.pending.forEach(o => this.raw(o));
    if (this.peer) {
      if (++this.k % 2 === 0 || document.hidden) this.raw({ t: 'hb' });
      if (Date.now() - this.lastHeard > 90000) this.lost('timeout');
    }
  }
  onRaw(text) {
    if (this.closed) return;
    let m;
    try { m = JSON.parse(text); } catch (e) { return; }
    if (!m || typeof m !== 'object' || m.from === this.me) return;
    if (m.to && m.to !== this.me) return;
    if (this.role === 'host' && m.t === 'join') {
      if (!this.peer) {
        this.peer = m.from; this.lastHeard = Date.now();
        this.send({ t: 'welcome' });
        this.connected = true;
        this.ev.open();
      } else if (m.from !== this.peer) this.raw({ t: 'busy', to: m.from });
      return;
    }
    if (!this.peer) {
      if (this.role !== 'guest') return;
      if (m.t === 'busy') { this.ev.msg({ t: 'busy' }); return; }
      if (m.t !== 'welcome') return;
      this.peer = m.from;
    }
    if (m.from !== this.peer) return;
    this.lastHeard = Date.now();
    if (m.t === 'ack') { this.pending.forEach((o, s) => { if (s <= m.upto) this.pending.delete(s); }); return; }
    if (m.t === 'hb') return;
    if (m.t === 'bye') { this.lost('bye'); return; }
    if (typeof m.seq !== 'number') return;
    if (m.seq >= this.next) this.held.set(m.seq, m);
    while (this.held.has(this.next)) {
      const x = this.held.get(this.next);
      this.held.delete(this.next); this.next++;
      if (x.t === 'welcome') { this.connected = true; this.ev.open(); }
      else this.ev.msg(x);
      if (this.closed) return;
    }
    this.raw({ t: 'ack', upto: this.next - 1 });
  }
  lost(reason) { if (this.closed) return; this.close(false); this.ev.lost(reason); }
  close(bye = true) {
    if (this.closed) return;
    if (bye && this.peer) this.raw({ t: 'bye' });
    this.closed = true;
    clearInterval(this.timer);
    setTimeout(() => this.clients.forEach(c => c.close()), 250);
  }
}

let link = null, linkTimer = null;
function send(m) { if (link && link.connected) link.send(m); }
function genCode() { return String(100000 + rnd(900000)); }
function cleanupNet() {
  clearTimeout(linkTimer);
  const l = link; link = null;
  if (l) l.close(true);
  G.code = null;
}
function loadingCard(title, text) {
  showCard(`<h2>${title}</h2>${loaderSVG({ w: 200 })}<p class="muted">${text}</p>
    <div class="row"><button class="btn" data-act="menu">Отмена</button></div>`);
}
function makeLink(code, role, onUp) {
  const l = new Relay(code, role, {
    up: n => { if (link === l) onUp(n); },
    open: () => { if (link === l) onLinkOpen(); },
    msg: m => { if (link === l) onNet(m); },
    lost: () => { if (link === l) onLinkLost(); },
  });
  return l;
}
function noServers() {
  showError('Не удалось подключиться ни к одному серверу игры. Проверь интернет и попробуй ещё раз.');
  cleanupNet();
}
function hostGame() {
  cleanupNet();
  G.mode = 'host';
  const code = genCode();
  G.code = code;
  loadingCard('Игра по сети', 'Выходим в море, подключаемся…');
  let shown = false;
  link = makeLink(code, 'host', n => {
    if (n > 0 && !shown && !link.connected) {
      shown = true;
      clearTimeout(linkTimer);
      showCard(`<h2>Твой код игры</h2>
        <div class="code">${code}</div>
        <p>Отправь этот код другу.<br>Он открывает игру → «Присоединиться» → вводит код.</p>
        ${loaderSVG({ w: 150 })}
        <p class="muted">Ждём друга…</p>
        <div class="row">${isApp() ? '<button class="btn red" data-act="share">Поделиться</button>' : ''}<button class="btn" data-act="copy">Скопировать код</button><button class="btn" data-act="menu">Отмена</button></div>`);
    }
  });
  linkTimer = setTimeout(() => { if (link && !link.up()) noServers(); }, 12000);
}
function joinScreen() {
  cleanupNet();
  showCard(`<h2>Присоединиться</h2>
    <p>Введи код, который прислал друг:</p>
    <input class="codeinput" id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">
    <div id="joinErr"></div>
    <div class="row"><button class="btn big red" data-act="joinGo">В бой!</button><button class="btn" data-act="menu">Назад</button></div>`);
  const inp = $('#codeIn');
  inp.focus();
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') joinGo(); });
}
function joinMsg(html) { const e = $('#joinErr'); if (e) e.innerHTML = html; }
function joinGo() {
  const inp = $('#codeIn');
  const code = (inp && inp.value || '').trim();
  if (!/^\d{6}$/.test(code)) { joinMsg('<p class="err">Код — это 6 цифр</p>'); return; }
  cleanupNet();
  G.mode = 'guest'; G.code = code;
  joinMsg(`${loaderSVG({ w: 140 })}<p class="muted">Плывём к другу…</p>`);
  let searching = false;
  link = makeLink(code, 'guest', n => {
    if (n > 0 && !searching && !link.connected) {
      searching = true;
      clearTimeout(linkTimer);
      linkTimer = setTimeout(() => {
        if (link && !link.connected) { cleanupNet(); joinMsg('<p class="err">Игра с таким кодом не найдена. Проверь код — и что друг ждёт на экране с кодом.</p>'); }
      }, 15000);
    }
  });
  linkTimer = setTimeout(() => {
    if (link && !link.up()) { cleanupNet(); joinMsg('<p class="err">Не удалось подключиться ни к одному серверу игры. Проверь интернет.</p>'); }
  }, 12000);
}
function onLinkOpen() {
  clearTimeout(linkTimer);
  sfx('win');
  if (G.mode === 'host') send({ t: 'cfg', size: N });   // размер поля задаёт создатель игры
  startPlacement();
  setStatus('Друг на связи! Расставляй корабли', 'red');
}
function onLinkLost() {
  if (!link) return;
  link = null;
  if ((G.mode === 'host' || G.mode === 'guest') && G.phase !== 'menu') {
    clearTimeout(G.aiTimer);
    showCard(`<h2>Связь потеряна</h2><p>Друг отключился или закрыл игру.</p>
      <div class="row"><button class="btn" data-act="menu">В меню</button></div>`);
    setStatus('Связь с другом потеряна', 'grey');
  }
}
function onNet(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'busy':
      showError('В этой игре уже двое игроков.'); cleanupNet(); break;
    case 'hello': break;
    case 'cfg':
      if (G.mode === 'guest' && MODES[m.size] && m.size !== N && G.phase === 'placing') {
        setSize(m.size);
        layout(true);
        startPlacement();
        setStatus(`Друг выбрал поле ${N}×${N} — расставляй корабли`, 'red');
      }
      break;
    case 'ready':
      G.oppReady = true;
      if (G.phase === 'placing') {
        if (G.meReady) { setStatus('Друг готов! Начинаем…', 'pen'); if (G.mode === 'host') hostBegin(); }
        else setStatus('Друг уже готов — расставляй корабли!', 'red');
      }
      break;
    case 'start':
      if (G.mode === 'guest' && G.phase === 'placing') { G.myTurn = m.first === 'guest'; startPlaying(); }
      break;
    case 'shot':
      if (G.phase === 'playing' && !G.myTurn && inb(m.r, m.c)) onIncomingShot(m.r, m.c);
      break;
    case 'res': {
      if (G.phase !== 'playing' || !G.pendingShot) break;
      const [r, c] = G.pendingShot;
      G.pendingShot = null;
      if (m.r !== r || m.c !== c) break;
      const cells = Array.isArray(m.cells) ? m.cells.map(x => [x[0], x[1]]) : null;
      const around = G.enemy.applyResult(r, c, m.res, cells);
      afterMyShot(r, c, { res: m.res, cells, around, over: !!m.over || G.enemy.allSunk() });
      break;
    }
    case 'reveal':
      if (Array.isArray(m.ships)) {
        G.enemy.ships = m.ships.map(cells => ({ cells, sunk: cells.every(([r, c]) => G.enemy.marks[r] && G.enemy.marks[r][c] === 2) }));
        if (G.phase === 'over' && $('#overlay').classList.contains('show')) renderBoard(vEn, G.enemy, false, true);
      }
      break;
    case 'again':
      G.oppWantAgain = true;
      if (G.wantAgain) startPlacement();
      else if (G.phase === 'over') {
        const note = $('#againNote');
        if (note) note.textContent = 'Друг хочет реванш!';
      }
      break;
    case 'bye':
      onLinkLost();
      break;
  }
}

window.addEventListener('pagehide', () => { if (link) link.close(true); });

/* =========================================================
   Карточки

function showCard(html) {
  $('#card').innerHTML = html; $('#overlay').classList.add('show');
  document.documentElement.classList.add('modal'); window.scrollTo(0, 0);
}
function closeCard() {
  $('#overlay').classList.remove('show');
  document.documentElement.classList.remove('modal');
}
function showError(text) {
  showCard(`<h2>Упс…</h2><p class="err">${text}</p><div class="row"><button class="btn" data-act="menu">В меню</button></div>`);
}
// «один 4-палубный, два 3-палубных…» для текущего флота
function fleetText(fleet) {
  const cnt = {};
  fleet.forEach(L => cnt[L] = (cnt[L] || 0) + 1);
  const num = ['', 'один', 'два', 'три', 'четыре', 'пять'];
  return Object.keys(cnt).map(Number).sort((a, b) => b - a)
    .map(L => `${num[cnt[L]] || cnt[L]} ${L}-палубны${cnt[L] === 1 ? 'й' : 'х'}`).join(', ');
}
const shipsWord = n => n % 10 === 1 && n % 100 !== 11 ? 'корабль' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'корабля' : 'кораблей';
function showMenu() {
  const sizeBtn = n => `<button class="btn small${n === N ? ' sel' : ''}" data-act="size" data-size="${n}">${n}×${n}</button>`;
  showCard(`<h2>Морской бой</h2>
    <p class="muted">на тетрадном листочке</p>
    <div class="modes"><span>Поле:</span>${sizeBtn(10)}${sizeBtn(8)}${sizeBtn(6)}</div>
    <div class="stack">
      <button class="btn big red" data-act="ai">Играть с компьютером</button>
      <button class="btn" data-act="host">Создать игру по сети</button>

function bindVolControls(root) {
  const setTrack = el => el.style.setProperty('--p', el.value + '%');
  root.querySelectorAll('input[data-vol]').forEach(el => {
    setTrack(el);
    const kind = el.dataset.vol;
    el.addEventListener('input', () => {

      document.querySelectorAll(`[data-volv="${kind}"]`).forEach(b => b.textContent = el.value);
      document.querySelectorAll(`input[data-vol="${kind}"]`).forEach(o => { if (o !== el) { o.value = el.value; setTrack(o); } });
      audioUnlocked = true; ensureAC();

      o.type = type; o.frequency.setValueAtTime(f1, at); o.frequency.exponentialRampToValueAtTime(f2, at + dur);
      g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(.001, at + dur);

    else if (type === 'bad') { tone(190, 130, .16, .07, 'square'); tone(150, 100, .16, .05, 'square', t + .12); }
    else if (type === 'page') { noise(.35, 'bandpass', 1400, .18, .8); noise(.2, 'highpass', 4000, .06, .7, t + .12); }

   ========================================================= */
// Два варианта: поля рядом (ПК, планшет/телефон в альбомной) или друг под другом
// (телефон, планшет в портретной). Берём тот, где клетка крупнее.
// Третий вариант — «компактный» (телефон лёжа): шапка колонкой слева, поля рядом на всю высоту.
function computeLayout() {
  const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  const w = window.innerWidth, h = window.innerHeight - sat;
  const sbw = Math.round(Math.min(220, Math.max(130, w * .17)));
  // BN — ширина одного поля с подписями в клетках (12 для 10×10, 10 для 8×8, 8 для 6×6)
  const side = Math.min((w - 30) / (2 * BN + 6.5), (h - 10) / (BN + 7.5));
  const stack = Math.min((w - 4) / (BN + 1.3), (h - 8) / (BN + 15));
  const compact = Math.min((w - sbw - 10) / (2 * BN + 1.6), (h - 16) / (BN + 1.4));   // флот — в левой колонке
  let mode = 'side', best = side;
  if (w < 600 || stack > best * 1.08) { mode = 'stack'; best = stack; }
  if (w >= 600 && h < 700 && compact > best * 1.15) { mode = 'compact'; best = compact; }
  const c = Math.max(14, Math.min(Math.floor(best), 64));
  return { c, mode, sbw };
}

function miniBoardId() {

  return (G.phase === 'playing' && !G.myTurn) ? 'svgEn' : 'svgMe';

let lastMiniId = null, ANIM = false, animT = null;
function applyMini(miniId) {
  document.documentElement.style.setProperty('--mini', MINI.toFixed(3));
  $('#sideMe').classList.toggle('minified', miniId === 'svgMe');
  $('#sideEn').classList.toggle('minified', miniId === 'svgEn');
}
function snap() {
  if (ANIM) return;                                  // во время анимации привяжем в конце
  const miniId = miniBoardId();
  if (miniId && lastMiniId && miniId !== lastMiniId) { swapAnimated(miniId); return; }
  lastMiniId = miniId;
  applyMini(miniId);
  snapOnly(miniId, MINI);
}
// Плавная смена крупного поля (FLIP): размеры меняются сразу, а видимое движение — только transform
function swapAnimated(miniId) {
  const boards = [$('#boardEn'), $('#boardMe')];
  const first = boards.map(b => b.getBoundingClientRect());
  lastMiniId = miniId;
  applyMini(miniId);
  snapOnly(miniId, MINI);
  const last = boards.map(b => b.getBoundingClientRect());
  ANIM = true;
  boards.forEach((b, i) => {
    const a = first[i], z = last[i];
    if (!a.width || !z.width) return;
    b.classList.add('flip');
    b.style.transition = 'none';
    b.style.transformOrigin = '0 0';
    b.style.transform = `translate(${f(a.left - z.left)}px,${f(a.top - z.top)}px) scale(${(a.width / z.width).toFixed(4)})`;
  });
  void document.body.offsetWidth;
  boards.forEach(b => {
    b.style.transition = 'transform .45s cubic-bezier(.22,.8,.25,1), opacity .35s, filter .35s';
    b.style.transform = '';
  });
  clearTimeout(animT);
  animT = setTimeout(() => {
    boards.forEach(b => { b.style.transition = ''; b.style.transformOrigin = ''; b.classList.remove('flip'); });
    ANIM = false;
    snap();
  }, 480);
}
function snapOnly(miniId, mini, s) {

  document.querySelectorAll('.board svg').forEach(svg => {
    if (miniId === svg.id) { svg.style.transformOrigin = '0 0'; svg.style.transform = `scale(${mini.toFixed(3)})`; return; }

    const r = svg.parentElement.getBoundingClientRect();

    svg.style.transform = `translate(${f(mod(s.left - r.left, C))}px,${f(mod(s.top - r.top, C))}px)`;

  cube(g, s, R, A) {

    stroke(g, rect(...P(.15, .35), .45 * s, .45 * s, R, .5), 'doodle', A());
    stroke(g, rect(...P(.38, .15), .45 * s, .45 * s, R, .5), 'doodle', A());
    stroke(g, line(...P(.15, .35), ...P(.38, .15), R, .3, 0) + line(...P(.6, .35), ...P(.83, .15), R, .3, 0)
      + line(...P(.15, .8), ...P(.38, .6), R, .3, 0) + line(...P(.6, .8), ...P(.83, .6), R, .3, 0), 'doodle', A());
  },
  tictactoe(g, s, R, A) {
    const P = (x, y) => [x * s, y * s];
    stroke(g, line(...P(.38, .1), ...P(.36, .9), R, .6, .04) + line(...P(.64, .1), ...P(.62, .9), R, .6, .04)
      + line(...P(.1, .37), ...P(.9, .36), R, .6, .04) + line(...P(.1, .63), ...P(.9, .62), R, .6, .04), 'doodle', A());
    const X = (cx, cy) => line(...P(cx - .08, cy - .08), ...P(cx + .08, cy + .08), R, .3, 0) + line(...P(cx + .08, cy - .08), ...P(cx - .08, cy + .08), R, .3, 0);
    stroke(g, X(.23, .23) + X(.5, .5) + X(.77, .77), 'doodle', A());
    stroke(g, blob(...P(.77, .23), s * .08, R) + blob(...P(.23, .77), s * .08, R), 'doodle', A());
    stroke(g, line(...P(.12, .12), ...P(.88, .88), R, .5, .05), 'doodle red', A());
  },
  anchor(g, s, R, A) {
    const P = (x, y) => [x * s, y * s];
    stroke(g, blob(...P(.5, .14), s * .07, R, 1.05, .05), 'doodle', A());
    stroke(g, line(...P(.5, .21), ...P(.5, .86), R, .4, 0) + line(...P(.32, .32), ...P(.68, .32), R, .4, 0), 'doodle', A());
    stroke(g, smooth([P(.18, .6), P(.26, .82), P(.5, .88), P(.74, .82), P(.82, .6)]), 'doodle', A());
    stroke(g, line(...P(.18, .6), ...P(.12, .7), R, .3, 0) + line(...P(.82, .6), ...P(.88, .7), R, .3, 0), 'doodle', A());
  },
  grade(g, s, R, A) {           // «пятёрка» от учителя
    const P = (x, y) => [x * s, y * s];
    stroke(g, blob(...P(.5, .5), s * .36, R, 1.12, .08), 'doodle red', A());
    const t = mk('text', { x: s * .5, y: s * .66, 'text-anchor': 'middle', 'font-size': s * .5, class: 'doodle-text red' }, g);
    t.textContent = '5';
  },
};
function renderDoodles() {
  const svg = $('#doodles');
  if (!svg) return;
  svg.innerHTML = '';
  if (!(G.phase === 'playing' || G.phase === 'over') || !G.doodleSeed) return;
  const sh = $('#sheet').getBoundingClientRect();
  const W = sh.width, H = sh.height;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pad = C * .3;
  // запретные зоны: шапка, статус, поля, флот в колонке, поля «Готов» — в координатах листа
  const ex = [];
  ['.title', '.tools', '#status > span', '#sideMe', '#sideEn', '#sideFleets'].forEach(sel => {
    const el = $(sel);
    if (!el || !el.offsetParent) return;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    // поле в бою может стать крупнее (смена хода на телефоне) — берём запас по его полному размеру
    const grow = (sel === '#sideMe' || sel === '#sideEn') && STACKED ? Math.max(0, BN * C - r.width) : 0;
    ex.push({ x: r.left - sh.left - pad - grow / 2, y: r.top - sh.top - pad, w: r.width + 2 * pad + grow, h: r.height + 2 * pad + grow });
  });
  const R = rng(G.doodleSeed);
  const anim = !G.doodlesShown;
  G.doodlesShown = true;
  let delay = .3;
  const A = () => anim ? { delay: (delay += .12), dur: .5 } : null;
  const placed = [];
  const fits = (x, y, w, h) => x >= 8 && y >= 8 && x + w <= W - C * 1.3 && y + h <= H - 8 &&
    !ex.concat(placed).some(r => x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y);
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const kinds = shuffle(Object.keys(DOODLES)), texts = shuffle(DOODLE_TEXTS).slice(0, 3);
  const items = [];
  for (let i = 0; i < 9; i++) items.push(i % 3 === 1 && texts.length ? { text: texts.pop() } : { kind: kinds[i] });
  items.forEach(it => {
    let w, h, fs = 0;
    if (it.text) { fs = C * (.62 + R() * .22); w = it.text.length * fs * .46; h = fs * 1.3; }
    else { w = h = C * (2.1 + R() * 1.4); }
    for (let t = 0; t < 70; t++) {
      const x = R() * (W - w), y = R() * (H - h);
      if (!fits(x, y, w, h)) continue;
      placed.push({ x: x - 6, y: y - 6, w: w + 12, h: h + 12 });
      const rot = (R() - .5) * (it.text ? 14 : 24);
      const g = mk('g', { transform: `translate(${f(x)} ${f(y)}) rotate(${f(rot)} ${f(w / 2)} ${f(h / 2)})` }, svg);
      if (it.text) {
        const el = mk('text', { x: 0, y: fs, 'font-size': fs, class: 'doodle-text' + (anim ? ' fadein' : '') }, g);
        el.textContent = it.text;
        if (anim) el.style.animationDelay = (delay += .15) + 's';
        if (R() < .5) stroke(g, line(0, fs * 1.18, w * .9, fs * 1.12, R, .8, 0), 'doodle', A());   // подчёркнуто
      } else DOODLES[it.kind](g, w, R, A);
      break;
    }
  });
}

let lastC = 0;
let MINI = .62, BASE_C = 0;
const satPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
function setCell(c) {
  C = c; lastC = c;
  document.documentElement.style.setProperty('--cell', C + 'px');
  document.documentElement.style.setProperty('--ui', Math.max(1, Math.min(1.6, C / 30)).toFixed(3));
  // первая прикидка размера своего поля в бою (потом fit() доведёт по факту)
  MINI = Math.max(.42, Math.min(1, ((window.innerHeight - satPx()) / C - (BN + 8.2)) / (BN - .4)));
}
function layout(force) {
  const { c, mode, sbw } = computeLayout();
  if (c !== BASE_C || mode !== MODE || force) {
    BASE_C = c; MODE = mode; STACKED = mode === 'stack';
    document.body.classList.toggle('stacked', mode === 'stack');
    document.body.classList.toggle('compact', mode === 'compact');
    document.documentElement.style.setProperty('--sbw', sbw + 'px');
    placeFleets(mode === 'compact');
    setCell(c);
    renderAll();
  } else snap();
  fit();
}
window.addEventListener('resize', () => layout(false));
// запасные сигналы смены размера (поворот экрана, панели браузера, клавиатура)
let relayoutT = null;
const relayoutSoon = () => { clearTimeout(relayoutT); relayoutT = setTimeout(() => layout(false), 120); };
if (window.visualViewport) visualViewport.addEventListener('resize', relayoutSoon);
window.addEventListener('orientationchange', relayoutSoon);
let lastVP = window.innerWidth + 'x' + window.innerHeight;
setInterval(() => { const vp = window.innerWidth + 'x' + window.innerHeight; if (vp !== lastVP) { lastVP = vp; layout(false); } }, 700);

// Подгонка под экран во время боя: всё должно помещаться без прокрутки.
// Сначала уменьшаем своё (нижнее) поле, затем — если не хватает — саму клетку.
let fitting = false;
function overflowPx() { return document.documentElement.scrollHeight - window.innerHeight; }
function fit() {
  if (fitting) return;
  fitting = true;
  const root = document.documentElement;
  document.body.classList.add('notrans');          // мерим уже установившиеся размеры, без анимации
  root.classList.remove('locked');
  const battle = G.phase === 'playing' || G.phase === 'over';
  if (battle) {
    for (let k = 0; k < 24; k++) {
      const over = overflowPx();
      if (over <= 0) break;
      if (STACKED && MINI > .42) {
        MINI = Math.max(.42, MINI - over / ((BN - .4) * C) - .004);
        snap();
        continue;
      }
      if (C <= 14) break;
      setCell(C - 1);
      renderAll();
    }
    if (overflowPx() <= 1) { root.classList.add('locked'); window.scrollTo(0, 0); }
  }
  void document.body.offsetWidth;
  document.body.classList.remove('notrans');
  fitting = false;
  renderDoodles();
}
if (window.ResizeObserver) new ResizeObserver(() => snap()).observe($('.boards'));

/* =========================================================
   Иконка вкладки / окна
   ========================================================= */
(() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" rx="10" fill="#fdfcf6" stroke="#8d9bb0" stroke-width="1.5"/><path d="M3 15H61M3 27H61M3 39H61M3 51H61M15 3V61M27 3V61M39 3V61M51 3V61" stroke="#bcd4ea" stroke-width="1"/><path d="M52 3V61" stroke="#e98a92" stroke-width="1.6"/><path d="M8 38 L54 38 L47 49 L15 49 Z" fill="#dfe6f5" stroke="#1f3d8f" stroke-width="3" stroke-linejoin="round"/><path d="M20 38V30H36V38M25 30V25H30V30M42 38V12" fill="none" stroke="#1f3d8f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M42 13L52 17L42 21Z" fill="#cf2f2a" stroke="#cf2f2a" stroke-width="2" stroke-linejoin="round"/><path d="M6 56q4-4 8 0t8 0t8 0t8 0t8 0t8 0" fill="none" stroke="#1f3d8f" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
})();

/* =========================================================
   Заставка с загрузкой
   ========================================================= */
function boot() {
  if (isApp()) { try { AndroidApp.ready(); } catch (e) {} }   // приложение видит, что игра запустилась
  updAudioBtns();
  layout(true);
  setStatus('Выбери режим игры', 'grey');

  $('#splashShip').innerHTML = loaderSVG({ w: 230, draw: true });
  const bar = $('#splashBar');
  const BR = rng(12345);
  stroke(bar, rect(4, 5, 292, 28, BR, 1.3), 'pen', { delay: .2, dur: .6 });
  const hatch = [];
  for (let x = 9; x <= 280; x += 7.5) {
    const p = mk('path', { d: line(x, 30, x + 9, 8, BR, .5, .05), class: 'pen mid' }, bar);
    p.style.display = 'none';
    hatch.push(p);
  }
  const setBar = p => {
    const n = Math.round(p * hatch.length);
    hatch.forEach((h, i) => {
      if (i < n && h.style.display === 'none') {
        h.style.display = '';
        h.setAttribute('pathLength', '1');
        h.classList.add('draw');
        h.style.setProperty('--dur', '.12s');
      }
    });
  };

  const phrases = ['Затачиваем карандаши…', 'Расчерчиваем клетки…', 'Спускаем корабли на воду…', 'Заряжаем пушки…', 'Ищем ластик…', 'Поднимаем флаги…'];
  let pi = 0;
  const txt = $('#splashText');
  const phT = setInterval(() => {
    pi = (pi + 1) % phrases.length;
    txt.innerHTML = `<span>${phrases[pi]}</span>`;
    txt.classList.remove('fresh'); void txt.offsetWidth; txt.classList.add('fresh');
  }, 950);

  const fontsP = Promise.race([
    document.fonts ? document.fonts.load('700 40px Caveat').then(() => document.fonts.ready) : Promise.resolve(),
    sleep(5000),
  ]).then(() => layout(true)).catch(() => {});
  const tasks = [fontsP];
  let done = 0;
  tasks.forEach(p => Promise.resolve(p).then(() => done++, () => done++));

  const t0 = performance.now(), MIN = 2600;
  let prog = 0;
  const tk = setInterval(() => {
    const time = Math.min(1, (performance.now() - t0) / MIN);
    const target = done >= tasks.length ? time : Math.min(time, (done + .6) / (tasks.length + .6));
    prog += (target - prog) * .3;
    if (target - prog < .005) prog = target;
    setBar(prog);
    if (prog >= 1 && done >= tasks.length) {
      clearInterval(tk); clearInterval(phT);
      txt.innerHTML = '<span>Готово! Можно начинать</span>';
      txt.classList.remove('fresh'); void txt.offsetWidth; txt.classList.add('fresh');
      const go = $('#splashGo');
      go.hidden = false;
      go.focus();
    }
  }, 60);

  const enter = () => {
    const sp = $('#splash');
    if (!sp || sp.classList.contains('out') || $('#splashGo').hidden) return;
    audioUnlocked = true;
    ensureAC();
    sfx('page');
    sp.classList.add('out');
    setTimeout(() => sp.remove(), 950);
    showMenu();
    updateMusic();
  };
  $('#splashGo').addEventListener('click', enter);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') enter(); });
}
boot();
})();
</script>
